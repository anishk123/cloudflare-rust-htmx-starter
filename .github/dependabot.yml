version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    groups:
      rust-cloudflare:
        patterns: ["worker", "worker-*"]
      rust-core:
        patterns: ["serde*", "schemars", "uuid", "maud"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
